<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="gradGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle -->
  <rect width="512" height="512" rx="128" fill="#0b0f19" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#gradPrimary)" stroke-width="8" stroke-opacity="0.3" />

  <!-- Outer Match Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#gradPrimary)" stroke-width="36" stroke-linecap="round" stroke-dasharray="750 250" transform="rotate(-45 256 256)" filter="url(#glow)" />

  <!-- Inner Sparkle Node -->
  <path d="M 256 140 L 276 216 L 352 236 L 276 256 L 256 332 L 236 256 L 160 236 L 236 216 Z" fill="url(#gradPrimary)" />
  <circle cx="256" cy="236" r="28" fill="#ffffff" />
</svg>
